name: Ejecutar Agente de Empleo Diario

on:
  schedule:
    # Se ejecuta todos los días a las 13:00 UTC (8:00 AM hora Colombia / ajusta según prefieras)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite ejecutar el script de forma manual desde la pestaña Actions en GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el Agente Autónomo
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
      run: python job_agent.py